<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dispatch{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('dashboard') }}">Dispatch</a></h1>
    <nav class="top-nav">
      <a href="{{ url_for('dashboard') }}">Home</a>
      <!-- /queue, /reports, and /ifta-clerk are Queue's, Reports', and
           the IFTA Clerk's own mounted apps, not shell routes -- url_for
           can't cross app boundaries, so these are the fixed mount
           prefixes from app.py, plain strings. -->
      <a href="/ifta-clerk/">IFTA Clerk</a>
      <a href="/queue/">Queue</a>
      <a href="/reports/">Reports</a>
      <a href="{{ url_for('pilot_page') }}">Pilot</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
